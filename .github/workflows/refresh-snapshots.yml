name: Refresh data snapshots

on:
  schedule:
    - cron: "0 */6 * * *"   # 6시간마다 (UTC)
  workflow_dispatch: {}      # 수동 실행 버튼

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate snapshots
        run: python3 generate_snapshots.py
      - name: Commit updated data
        run: |
          git config user.name "airauto-bot"
          git config user.email "airauto-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore: refresh data snapshots"
          git push
